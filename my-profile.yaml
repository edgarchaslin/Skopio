# =====================================================================
#  YOUR PROFILE - the only file you really need to edit.
#
#  Fill in the three fields below, then the keywords block.
#  Everything after that is optional and can stay as it is.
# =====================================================================

name: "First Last"
email: "first.last@my-lab.org"       # where the report is sent
report_title: "Skopio"


# =====================================================================
#  KEYWORDS
#
#  ONE TERM PER LINE. The prefix states its importance:
#
#    !!!  critical    must surface even alone   - queries the databases
#    !!   important   counts heavily            - queries the databases
#    !    useful      reinforces an article     - does not query
#         (nothing)   context, light bonus      - does not query
#    -    exclusion   drops the article
#    ~    tracked author  (First Last)
#    @    preferred journal
#
#  TWO OPERATORS:
#
#    |   variants of the SAME concept, counted only once
#        !!! CO2 capture | carbon dioxide capture | CO₂ capture
#        -> an article using all three does not count three times
#
#    &   every term must be present
#        !!! ionic conductivity & lithium
#        -> drops articles matching only one of the two
#
#  ONE MODIFIER:
#
#    ^   match in the TITLE only (right after the prefix)
#        !!^ nanoparticle
#        -> ignores articles merely name-dropping the word
#
#  No need to multiply variants: Skopio already ignores accents,
#  subscripts (CO₂ = CO2), hyphens and English plurals.
#  WRITE IN ENGLISH: that is the language of the queried databases.
#
#  How many lines? 25 to 60. Below 15 the report will be thin,
#  above 100 it becomes chatty.
#
#  Out of ideas? Run:
#      python tools/suggest_keywords.py --orcid 0000-0002-1825-0097
#  It analyses your publications and drafts a starting point.
#
#  The example below covers solid electrolytes:
#  REPLACE IT ENTIRELY with your own terms.
# =====================================================================

keywords: |
  # --- the core of your topic: 5 to 12 lines ---------------------------
  !!! solid electrolyte | solid-state electrolyte
  !!! garnet electrolyte | LLZO
  !!! ionic conductivity & lithium
  !!! all-solid-state battery

  # --- important: methods, phenomena, subfields ------------------------
  !!  dendrite suppression | lithium dendrite
  !!  solid electrolyte interphase | SEI
  !!  cathode coating
  !!  sulfide electrolyte

  # --- useful: reinforces without being sufficient ---------------------
  !   impedance spectroscopy
  !   cold sintering
  !   operando tomography
  !   capacity retention

  # --- context: light bonus, no query ----------------------------------
      machine learning screening
      density functional theory

  # --- exclusions: what pollutes your keywords -------------------------
  # Watch the "Radar" section of your first reports: that is where the
  # topics worth excluding show up.
  -   photocatalysis | photocatalytic
  -   dye degradation
  -   supercapacitor

  # --- tracked authors (optional) --------------------------------------
  # ~   First Last

  # --- preferred journals (optional) -----------------------------------
  @   Nature Energy
  @   Advanced Energy Materials


# =====================================================================
#  OPTIONAL SETTINGS
#  Everything below has a sensible default. You may delete these
#  sections entirely and Skopio will still work.
# =====================================================================

# --- Split into the three sections -----------------------------------
# "auto" adapts to the daily volume: the top 15 % go to "Must read",
# the next 45 % to "Relevant". Recommended to start with.
# To freeze the thresholds once calibrated:
#   thresholds:
#     must_read: 18
#     relevant: 9
thresholds: auto

# --- Number of articles per section ----------------------------------
volume:
  must_read: 8
  relevant: 15
  radar: 25
  bullets: 3          # sentences extracted per article (2 = denser report)

# --- Prefix scale -----------------------------------------------------
# Only worth touching after a week of observation.
# weights:
#   critical: 3.0
#   important: 2.0
#   useful: 1.0
#   context: 0.5

# --- Fine tuning ------------------------------------------------------
# options:
#   minimum_score: 3.0          # below this, the article never appears
#   author_bonus: 3.0
#   journal_bonus: 2.0
#   recency_bonus: 1.5          # advantage given to same-day articles
#   exclusion_penalty: -4.0     # exclusion found in the abstract
#   no_abstract_penalty: -2.0
#   must_read_floor: 12.0       # in auto mode
#   relevant_floor: 6.0
